services:
    lenia-devcontainer:
        image: lenia-devcontainer
        container_name: lenia-devcontainer
        build:
            context: .
            dockerfile: Dockerfile
            target: devcontainer
        volumes:
            - .:/workspace:cached
        environment:
            NVIDIA_DRIVER_CAPABILITIES: compute,utility
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        entrypoint: ["tail", "-f", "/dev/null"]
        networks:
            - lenia

    lenia-core:
        image: lenia-core
        container_name: lenia-core
        build:
            context: .
            dockerfile: Dockerfile
            target: core
        networks:
            - lenia

    lenia-app:
        image: lenia-app
        container_name: lenia-app
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        ports:
            - "9876:9876"
        environment:
            NVIDIA_DRIVER_CAPABILITIES: compute,utility
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        restart: unless-stopped
        networks:
            - lenia

networks:
    lenia:
        name: lenia
        driver: bridge
