<text x="40" y="80" font-size="18" fill="#172033" >Four wires · 3.3 V · I²C · physical header pin numbers</text>
<rect x="50" y="115" width="280" height="260" rx="16" fill="#fff" stroke="#a8b5c7" stroke-width="2"/>
<text x="75" y="145" font-size="20" fill="#172033" font-weight="bold">Sensor cable signals</text>
