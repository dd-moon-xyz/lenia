<text x="660" y="118" font-size="17" fill="#dc2626" font-weight="bold">PIN 1 ↙</text>
<text x="640" y="725" font-size="20" fill="#172033" font-weight="bold">40-pin GPIO header</text>
<text x="640" y="751" font-size="16" fill="#172033" >Top view · pins facing you</text>
<text x="70" y="420" font-size="18" fill="#172033" >JST-SH end → either sensor port</text>
<text x="70" y="450" font-size="18" fill="#172033" >Breakout adapter → jumpers → Pi</text>
<text x="70" y="495" font-size="16" fill="#172033" >Signal order shown here is logical,</text>
<text x="70" y="519" font-size="16" fill="#172033" >not connector contact order.</text>
<text x="70" y="555" font-size="16" fill="#172033" >Verify your cable’s signal mapping.</text>
<text x="70" y="579" font-size="16" fill="#172033" >500 mm cable: green SDA, white SCL.</text>
<rect x="40" y="780" width="880" height="45" rx="8" fill="#fff0da"/>
<text x="60" y="808" font-size="19" fill="#803b00" font-weight="bold">Power off before wiring. Use 3.3 V; never use 5 V pins 2 or 4.</text>
</g></svg>
